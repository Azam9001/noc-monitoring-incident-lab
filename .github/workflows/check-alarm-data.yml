name: Check simulated alarm data (Java)

on:
  push:
    paths:
      - 'alarms/sample-alarms.csv'
      - 'java/**'
      - '.github/workflows/check-alarm-data.yml'
  pull_request:
    paths:
      - 'alarms/sample-alarms.csv'
      - 'java/**'
      - '.github/workflows/check-alarm-data.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Java source and test
        run: javac -d java/out java/src/AlarmAnalysis.java java/test/AlarmAnalysisTest.java
      - name: Run Java tests
        run: java -cp java/out AlarmAnalysisTest
      - name: Print synthetic alarm summary
        run: java -cp java/out AlarmAnalysis
